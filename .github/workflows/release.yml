name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to publish when running manually"
        required: false
        type: string
      swiftbeaver_version:
        description: "SwiftBeaver tag to bundle; leave empty for latest compatible CPU-only release"
        required: false
        type: string

permissions:
  contents: write

env:
  MIN_SWIFTBEAVER_VERSION: "0.5.1"
  SWIFTBEAVER_REPO: gaestu/SwiftBeaver
  SWIFTBEAVER_FLAVOR: cpu-only
  SWIFTBEAVER_ASSET: swiftbeaver-linux-x86_64-cpu-only.tar.gz
  PACKAGE_NAME: swiftbeaverlodge-linux-x86_64

jobs:
  linux-x86_64:
    name: Linux x86_64 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.release_tag }}"
          fi

          if [[ -z "${release_tag}" ]]; then
            echo "Manual release runs must provide the release_tag input." >&2
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        shell: bash
        run: cargo test --locked --all-targets --all-features

      - name: Build SwiftBeaverLodge
        shell: bash
        run: cargo build --release --locked --bin swiftbeaverlodge

      - name: Resolve SwiftBeaver release
        id: swiftbeaver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SWIFTBEAVER_VERSION: ${{ inputs.swiftbeaver_version }}
        run: |
          set -euo pipefail
          source .github/scripts/release-version.sh

          if [[ -n "${REQUESTED_SWIFTBEAVER_VERSION}" ]]; then
            swiftbeaver_tag="${REQUESTED_SWIFTBEAVER_VERSION}"
          else
            swiftbeaver_tag=""
            release_tags_file="${RUNNER_TEMP}/swiftbeaver-release-tags.txt"
            if ! gh api "repos/${SWIFTBEAVER_REPO}/releases" --paginate \
              --jq ".[] | select(.draft == false and .prerelease == false) | select([.assets[].name] | index(\"${SWIFTBEAVER_ASSET}\")) | .tag_name" \
              > "${release_tags_file}"; then
              echo "Failed to query ${SWIFTBEAVER_REPO} releases while looking for ${SWIFTBEAVER_ASSET}." >&2
              exit 1
            fi

            while IFS= read -r candidate_tag; do
              if version_ge "${candidate_tag}" "${MIN_SWIFTBEAVER_VERSION}"; then
                swiftbeaver_tag="${candidate_tag}"
                break
              else
                echo "Skipping incompatible or malformed SwiftBeaver release tag: ${candidate_tag}" >&2
              fi
            done < "${release_tags_file}"
          fi

          if [[ -z "${swiftbeaver_tag}" ]]; then
            echo "No compatible ${SWIFTBEAVER_ASSET} release found in ${SWIFTBEAVER_REPO}." >&2
            exit 1
          fi

          if ! version_ge "${swiftbeaver_tag}" "${MIN_SWIFTBEAVER_VERSION}"; then
            echo "SwiftBeaver release tag ${swiftbeaver_tag} is older than required v${MIN_SWIFTBEAVER_VERSION}, or is not a parseable version tag." >&2
            exit 1
          fi

          if ! gh release view "${swiftbeaver_tag}" --repo "${SWIFTBEAVER_REPO}" --json assets \
            --jq ".assets[].name" | grep -Fxq "${SWIFTBEAVER_ASSET}"; then
            echo "SwiftBeaver release ${swiftbeaver_tag} does not contain ${SWIFTBEAVER_ASSET}." >&2
            exit 1
          fi

          echo "tag=${swiftbeaver_tag}" >> "${GITHUB_OUTPUT}"
          echo "Bundling SwiftBeaver ${swiftbeaver_tag} (${SWIFTBEAVER_FLAVOR})."

      - name: Download SwiftBeaver engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFTBEAVER_TAG: ${{ steps.swiftbeaver.outputs.tag }}
        run: |
          set -euo pipefail

          download_dir="${RUNNER_TEMP}/swiftbeaver-download"
          mkdir -p "${download_dir}"

          gh release download "${SWIFTBEAVER_TAG}" \
            --repo "${SWIFTBEAVER_REPO}" \
            --pattern "${SWIFTBEAVER_ASSET}" \
            --pattern SHA256SUMS \
            --dir "${download_dir}"

          if [[ ! -s "${download_dir}/${SWIFTBEAVER_ASSET}" ]]; then
            echo "Downloaded SwiftBeaver asset is missing or empty: ${SWIFTBEAVER_ASSET}" >&2
            exit 1
          fi

          if [[ ! -s "${download_dir}/SHA256SUMS" ]]; then
            echo "SwiftBeaver release ${SWIFTBEAVER_TAG} did not include SHA256SUMS." >&2
            exit 1
          fi

          checksum_status=0
          grep -E "[[:space:]]${SWIFTBEAVER_ASSET}$" "${download_dir}/SHA256SUMS" > "${download_dir}/SHA256SUMS.selected" || checksum_status=$?
          if [[ "${checksum_status}" -ne 0 ]]; then
            if [[ "${checksum_status}" -eq 1 ]]; then
              echo "SHA256SUMS for SwiftBeaver ${SWIFTBEAVER_TAG} did not contain ${SWIFTBEAVER_ASSET}." >&2
            else
              echo "Failed to inspect SwiftBeaver ${SWIFTBEAVER_TAG} SHA256SUMS for ${SWIFTBEAVER_ASSET}; grep exited ${checksum_status}." >&2
            fi
            exit 1
          fi
          (cd "${download_dir}" && sha256sum -c SHA256SUMS.selected)

          extract_dir="${RUNNER_TEMP}/swiftbeaver-extract"
          mkdir -p "${extract_dir}"
          tar -xzf "${download_dir}/${SWIFTBEAVER_ASSET}" -C "${extract_dir}"

          binary_path="$(find "${extract_dir}" -type f -name swiftbeaver -perm /111 | head -n 1)"
          if [[ -z "${binary_path}" ]]; then
            binary_path="$(find "${extract_dir}" -type f -name swiftbeaver | head -n 1)"
          fi

          if [[ -z "${binary_path}" ]]; then
            echo "SwiftBeaver archive ${SWIFTBEAVER_ASSET} did not contain a swiftbeaver executable." >&2
            exit 1
          fi

          chmod 0755 "${binary_path}"
          version_output="$("${binary_path}" --version)" || {
            echo "Bundled SwiftBeaver candidate failed to run --version: ${binary_path}" >&2
            exit 1
          }
          source .github/scripts/release-version.sh
          bundled_version="$(extract_version "${version_output}")"
          if [[ -z "${bundled_version}" ]]; then
            echo "Could not parse bundled SwiftBeaver --version output: ${version_output}" >&2
            exit 1
          fi

          if ! version_ge "${bundled_version}" "${MIN_SWIFTBEAVER_VERSION}"; then
            echo "Bundled SwiftBeaver reports ${bundled_version}, which is older than required v${MIN_SWIFTBEAVER_VERSION}." >&2
            exit 1
          fi

          echo "Bundled SwiftBeaver binary reports: ${version_output}"

          echo "SWIFTBEAVER_BINARY=${binary_path}" >> "${GITHUB_ENV}"

      - name: Package release archive
        shell: bash
        env:
          SWIFTBEAVER_TAG: ${{ steps.swiftbeaver.outputs.tag }}
        run: |
          set -euo pipefail

          package_dir="${RUNNER_TEMP}/${PACKAGE_NAME}"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${package_dir}/bin" "${dist_dir}"

          cp target/release/swiftbeaverlodge "${package_dir}/swiftbeaverlodge"
          cp "${SWIFTBEAVER_BINARY}" "${package_dir}/bin/swiftbeaver"
          chmod 0755 "${package_dir}/swiftbeaverlodge" "${package_dir}/bin/swiftbeaver"

          cp README.md LICENSE "${package_dir}/"
          cat > "${package_dir}/BUNDLED_SWIFTBEAVER.txt" <<EOF
          SwiftBeaverLodge release: ${RELEASE_TAG}
          Bundled SwiftBeaver release: ${SWIFTBEAVER_TAG}
          Bundled SwiftBeaver asset: ${SWIFTBEAVER_ASSET}
          Bundled SwiftBeaver flavor: ${SWIFTBEAVER_FLAVOR}
          EOF

          tar -C "${RUNNER_TEMP}" -czf "${dist_dir}/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          (cd "${dist_dir}" && sha256sum "${PACKAGE_NAME}.tar.gz" > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false

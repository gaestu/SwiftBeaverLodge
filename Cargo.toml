[package]
name = "swiftbeaverlodge"
version = "0.1.0"
edition = "2021"
description = "GUI Frontend for SwiftBeaver Forensic File Carver"
authors = ["SwiftBeaverLodge Team"]
license = "Apache-2.0"
repository = "https://github.com/gaestu/SwiftBeaverLodge"

[lib]
name = "swiftbeaverlodge"
path = "src/lib.rs"

[[bin]]
name = "swiftbeaverlodge"
path = "src/main.rs"

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }

# Async runtime
tokio = { version = "1", features = ["full", "process"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1.4"

# Parquet reading
parquet = { version = "54", default-features = false, features = ["arrow"] }
arrow = { version = "54", default-features = false }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random ID generation
rand = "0.8"

# File dialogs
rfd = "0.15"

# Image loading for thumbnails
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Binary path detection
which = "7"

# System info
sysinfo = "0.32"

# Unix signals
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
